<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC Artes Digitais — Painel de Pedidos</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
  header { background: #111; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: #bbb; font-size: 13px; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  input[type="password"] { padding: 8px; font-size: 14px; width: 280px; }
  button { padding: 8px 14px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; background: #111; color: #fff; }
  button.secondary { background: #ddd; color: #111; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
  th { background: #fafafa; }
  .status { font-weight: bold; }
  #msg { color: #b00; min-height: 20px; }
</style>
</head>
<body>
<header>
  <h1>FC Artes Digitais — Painel de Pedidos</h1>
  <p>Atendimento WhatsApp • prévia com marca primeiro • HD só após pagamento confirmado</p>
</header>
<main>
  <div class="row">
    <label>Token de admin: <input type="password" id="token" placeholder="ADMIN_TOKEN do .env"></label>
    <button id="refresh">Atualizar</button>
    <span id="health"></span>
  </div>
  <p id="msg"></p>
  <table>
    <thead>
      <tr><th>Pedido</th><th>Telefone</th><th>Estilo</th><th>Qtd.</th><th>Preço</th><th>Status</th><th>Ações</th></tr>
    </thead>
    <tbody id="orders"><tr><td colspan="7">Carregando…</td></tr></tbody>
  </table>
</main>
<script src="app.js"></script>
</body>
</html>
